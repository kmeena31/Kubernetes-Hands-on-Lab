name: Test Pre-installed Docker

# This triggers the action every time you push code to the main branch
on:
  push:
    branches: [ "main" ]

jobs:
  run-docker-commands:
    # "ubuntu-latest" is the GitHub-hosted runner that comes with Docker
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your repository code onto the runner
      - name: Checkout project code
        uses: actions/checkout@v4

      # The "|" character tells GitHub Actions to read the following lines as a shell script
      - name: Pull Docker Images in a Loop
        run: |
          for img in hello-world nginx:1.28-alpine ubuntu:24.04 alpine:3.22 node:24-alpine; do
            echo "Pulling image: $img"
            docker pull "$img"
          done
      # Verification step: This lists all images currently sitting on the runner
      - name: Verify Installed Images
        run: |
          echo "=== Listing Installed Docker Images ==="
          docker images