name: Pods, Pod Lifecycle & Services — Step-by-Step Lab
#Create Pods three ways, watch their lifecycle, break them on purpose and fix them, then give them stable names with Services and DNS. Finish with multi-container Pods, two 2026 features and user namespaces. Sixteen steps, in order.
on:
  push:
    branches: [ "main" ]

jobs:
  Part-A:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Download your repository code onto the runner
      - name: Checkout project code
        uses: actions/checkout@v4
      
      - name: Step1 - Run Pre-req.sh & script to load images into the kind cluster
        run: |
          chmod +x ./Module3-lab/Pre-req.sh
          echo "Running Pre-req.sh script to load images into the kind cluster..."
          ./Module3-lab/Pre-req.sh

      - name: Step2 - Create a pod impreatively 
        run: |
          chmod +x ./Module3-lab/2-CreatePodImperatively.sh
          echo "Running 2-CreatePodImperatively.sh script to create a pod imperatively..."
          ./Module3-lab/2-CreatePodImperatively.sh

      - name: Step3 - Generate yaml, then apply it 
        run: |
          chmod +x ./Module3-lab/3-Generate-Yaml.sh
          echo "Running 3-Generate-Yaml.sh script to generate yaml..."
          ./Module3-lab/3-Generate-Yaml.sh

      - name: Step4 - Talk to pod by its IP
        run: |
          chmod +x ./Module3-lab/4-TalktoaPodbyitsIP.sh
          echo "Running 4-TalktoaPodbyitsIP.sh script to talk to the pod..."
          ./Module3-lab/4-TalktoaPodbyitsIP.sh

      - name: Step5 - Watch the lifecycle of pods
        run: |
          chmod +x ./Module3-lab/5-watchthelifecycle.sh
          echo "Running 5-watchthelifecycle.sh script to watch the lifecycle..."
          ./Module3-lab/5-watchthelifecycle.sh

      - name: Step6 - Image Pull Back Off
        run: |
          chmod +x ./Module3-lab/6-ImagePullBackOff.sh
          echo "Running 6-ImagePullBackOff.sh script to simulate image pull backoff..."
          ./Module3-lab/6-ImagePullBackOff.sh
      
      - name: Step7 - CrashLoopBackOff
        run: |
          chmod +x ./Module3-lab/7-CrashLoopBackOff.sh
          echo "Running 7-CrashLoopBackOff.sh script to simulate crash loop..."
          ./Module3-lab/7-CrashLoopBackOff.sh
      
