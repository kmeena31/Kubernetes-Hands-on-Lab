name: Kubernetes Architecture & kubectl — Step-by-Step Lab
# Build your lab cluster
# Steps 1–3 · kind (Kubernetes IN Docker) · ~20 min
# 1. Install kubectl and kind
# 2. Create a 3-node cluster
# 3. First contact with the cluster
on:
  push:
    branches: [ "main" ]

jobs:
  Module2-run-lab-part-a:
    # "ubuntu-latest" is the GitHub-hosted runner that comes with Docker
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your repository code onto the runner
      - name: Checkout project code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
            username: meenakande
            password: ${{ secrets.DOCKERHUB_TOKEN }}  # Safely uses your GitHub Secret

      - name: "Pre-req-1: Pull and Tag Image"
        run: |
          bash Module2-lab/Part-A/pull_tag_image.sh

      - name: " Step -2 : Create 3-node cluster"
        run: |
            bash Module2-lab/Part-A/Step2-create3nodecluster.sh
      
      - name: "step 3: First contact with the cluster"
        run: |
          bash Module2-lab/Part-A/Step3-Firstcontactwiththecluster.sh

        #Goal: Find every architecture component from the slides, running as a real pod on a real node.
      - name: "step 4 - See the control plane running"
        run: |
          cd Module2-lab/
          kubectl get pods -n kube-system -o wide --sort-by=.spec.nodeName

           #Goal: Step inside a node and find the kubelet and the container runtime — and notice what's missing.
      - name: "step 5 - Look inside a worker node"
        run: |
          cd Module2-lab/
          echo "=== systemctl is active =================="
          docker exec lab-worker systemctl is-active kubelet containerd
          echo "============message says docker is not instaled if not =================="
          docker exec lab-worker sh -c 'command -v docker || echo "docker: not installed"'
          echo "=== s docker lab-worker ps status =================="
          docker exec lab-worker crictl ps
          echo "=== kubectl get nodes =================="
          kubectl get nodes -o wide
          
          echo "=== Running process check inside node =================="
          docker exec lab-worker sh -c "ps -e -o comm | grep -E 'kubelet|containerd' | sort -u"

        #   echo "=== Running bash inside docker =================="
        #   docker exec -it lab-worker bash
        #    # now inside the node:
        #   ps -e -o comm | grep -E 'kubelet|containerd' | sort -u
        #   exit
    #Goal: See the HTTPS request behind a kubectl command, call the API directly, then peek at etcd.
      - name: "step 6 - kubectl is just an API client"
        run: |
          cd Module2-lab/
          echo "======Turn up verbosity to see the real request======"
          kubectl get nodes -v=6 2>&1 |grep -E 'Config loaded|Response'
          echo "====Call API endpoints directly======================"
          kubectl get --raw /readyz
          echo 
          kubectl get --raw '/readyz?response' |tail -3
          kubectl get --raw  /api/v1/namespaces/default |head -n 200 ; echo
          echo "===Look at where nodes are stored in etcd (read-only)======"
          kubectl -n kube-system exec etcd-lab-control-plane -- etcdctl \
            --cacert /etc/kubernetes/pki/etcd/ca.crt \
            --cert   /etc/kubernetes/pki/etcd/server.crt \
            --key    /etc/kubernetes/pki/etcd/server.key \
              get    /registry/minions --prefix --keys-only

      #Goal: Understand what a context is, switch between two of them, and recognise the two most common connection errors.
      - name: "Step 7 - kubeconfig and contexts"
        continue-on-error: true
        run: |  
          echo "===== Displaying current context ====="  
          kubectl config current-context
          echo "====== Displaying get context ========= "
          kubectl config get-contexts
          echo "======= Displaying view ============="
          kubectl config view --minify
          echo "=========Make a second context with a different default namespace  called kube-system==========="
          kubectl config set-context lab-system \
            --cluster kind-lab --user kind-lab --namespace kube-system
          echo "==========Check use-context of lab-system ============"
          kubectl config use-context lab-system
          echo "=========== check get-context ===================="
          kubectl config get-contexts
          echo "=========== get pods ========================"
          kubectl get pods |head -4
          echo "=========== switch back======================"
          kubectl config use-context kind-lab
          echo "=========== check get pods =================="
          kubectl get pods
          echo "=========== Recognise the two classic errors==========="
          kubectl get nodes --context does-not-exist
          echo "============ checking server connect & port ==========="
          kubectl get nodes --server https://127.0.0.1:1 --request-timeouts=5s 2>&1 |tail -1 
        #Goal : Print the same nodes as a wide table, a single field, just names, custom columns, and KYAML.
      - name: "Step 8 - Output formats — same data, your way"
        run: |
           cd Module2-lab/
           echo "======== Display get nodes by wide option ==============="
           kubectl get nodes -o wide 
           echo "========= Display get node by name =========="
           kubectl get nodes -o name
           echo "========= Display by using json path option ========"
           kubectl get nodes -o jsonpath='{.items[*].metadata.name}'; echo

           echo "=========Build your own table============="
           kubectl get nodes -o custom-columns='NAME:.metadata.name,RUNTIME:.status.nodeInfo.containerRuntimeVersion,KUBELET:.status.nodeInfo.kubeletVersion,CPU:.status.capacity.cpu'
           
           echo "=========== Full objects: YAML vs KYAML =========="
           kubectl get node lab-worker -o yaml |head -8  # In Yaml

           Kubectl get node lab-worker -o kyaml |head -8 # In kyaml
       # Goal: Use kubectl as its own manual: deep-inspect a node, list every resource type, and read field docs.
      - name: "Step 9 - Describe, discover and explain"
        run: |
            kubectl describe node lab-worker | grep -E '^(Name|Roles|Taints):|Ready|InternalIP|Container Runtime|Non-terminated'
            kubectl describe node lab-control-plane | grep Taints
            echo "=========== Every resource type the cluster knows ========="
            kubectl api-resources | head -1
            kubectl api-resources | grep -wE 'pods|nodes|namespaces|services|deployments'
            kubectl api-resources | wc -l
            echo "========= Read the docs for any field ==================="
            kubectl explain pod.

