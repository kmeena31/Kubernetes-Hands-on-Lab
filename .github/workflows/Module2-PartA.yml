name: Kubernetes Architecture & kubectl — Step-by-Step Lab
# Build your lab cluster
# Steps 1–3 · kind (Kubernetes IN Docker) · ~20 min
# 1. Install kubectl and kind
# 2. Create a 3-node cluster
# 3. First contact with the cluster
on:
  push:
    branches: [ "main" ]

jobs:
  Module2-run-lab-part-a:
    # "ubuntu-latest" is the GitHub-hosted runner that comes with Docker
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your repository code onto the runner
      - name: Checkout project code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
            username: meenakande
            password: ${{ secrets.DOCKERHUB_TOKEN }}  # Safely uses your GitHub Secret

      - name: "Pre-req-1: Pull and Tag Image"
        run: |
          # 1. Pull the image from your Docker Hub repository
          docker pull meenakande/module1-demo-api:1.0.0
          
          # 2. (Optional) Create a local tag if subsequent scripts need the short name
          docker tag meenakande/module1-demo-api:1.0.0 module1-demo-api:1.0.0
          
          # 3. Verify the image is locally available on the runner
          docker images

          # 4. Install Kind & nginx packages"
          echo "Installing Kind package"
            docker pull kindest/node:v1.37.0
            
          echo "Installing Kind package" 
            docker pull nginx:1.28-alpine
            
          #5. checking kind,nginx is installed or not 
          kubectl version --client
          kind version
          docker info --format '{{.ServerVersion}}'
          
         
          
         